name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xasha-production-deployment
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: 'false'

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate and deploy production
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://xasha.boluakinyemi500.workers.dev
    steps:
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN as a production environment or repository secret.'
            exit 1
          fi
      - name: Build production
        run: npm run build:production
      - name: Validate production build
        run: npx --no-install cf deploy --prebuilt --mode production --dry-run
      - name: Apply production migrations
        run: npm run db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy validated production build
        run: npx --no-install cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live secret lifecycle
        run: node tests/live-smoke.mjs https://xasha.boluakinyemi500.workers.dev
